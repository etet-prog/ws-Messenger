<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WsChat | Landing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">  
        <div class="center">
            <h1 class="heading"> Welcome! </h1>
        </div>
        <form action="/submit" method="post">
            <div class="center">
                <input class="input" id="usernameInp" placeholder="Username" name="username" required><br><br>
            </div>
            <div class="center">
                <input class="input" id="roomInp" placeholder="Room ID" name="roomId" required><br><br>
            </div>
            <div class="center">
                <button class="button" type="submit"> Join </button>
            </div>
        </form>
    </div>
</body>
</html>
