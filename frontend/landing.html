<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <h1> Welcome </h1>
    </div>
    <form action="/submit" method="post">
        <div class="parent">
            <input class="input" placeholder="Username" name="username" required><br><br>
        </div>
        <div class="parent">
            <input class="input" placeholder="Room ID" name="roomId" required><br><br>
        </div>
        <div class="parent">
            <button class="button" type="submit" > Join </button>
        </div>
    </form>
</body>
</html>
